# Salinan cctv_13nov.yaml untuk rekaman sabtu (14nov_sabtu), garis hitung sama.
# Config cuplikan CCTV situs, rekaman Jumat 13 Nov 2026 sore (7 kamera mulai 16.02 WIB, 2 kamera Gasibu Atas mulai
# 18.26 WIB), tiap rekaman sekitar 1 menit di data/video/situs_13nov/. Satu titik per kamera.
# Rekaman dibuat dengan ffmpeg langsung (bukan rekam_cctv.py), jadi tidak ada file .json; jam mulai diambil dari
# rekam.log (jam ffmpeg dijalankan, ketelitian sekitar satu potongan HLS).
# Kamera yang sama dengan uji 29 Okt memakai garis lama yang dicek ulang di frame siang. S2 dan T1_T2 kali ini
# direkam dari kamera lain (Sekeloa 01 dan PHH Mustofa-PUSDAI 01), jadi garisnya dikalibrasi baru, begitu juga dua
# kamera Gasibu Atas.
# Cek ulang di frame siang: garis S1, V_Sulanjana, V_DU_Selatan, V_Djuanda_Hasanuddin tetap. Garis V_Surapati_Merak
# ujung kirinya digeser dari x 185 ke 150 karena lajur ke timur (paling kiri, banyak motor) belum terbentang penuh.
# S2: kamera Sekeloa CCTV-02 arah Unikom, dihitung arus menghadap kamera (ke selatan). T1_T2: kamera arah perempatan
# Pahlawan, dihitung arus menjauhi kamera (ke timur). Gasibu: arus menjauhi kamera.
interval_menit: 1
model:
  bobot: yolo26s.pt
  imgsz: 640
  conf: 0.1
  tracker: bytetrack.yaml
  kelas: [1, 2, 3, 5, 7]
  kedalaman_asal: 0.2
  min_frame_track: 5

titik:
  - id: S1
    cctv: {nama: "CCTV ITB KEBUN BINATANG 01", url: "https://pelindung.bandung.go.id:3443/video/DAHUA/ITBKebun.m3u8"}
    imgsz: 1280                         # video kamera ini 1280x720
    video: data/video/14nov_sabtu/S1_*.ts
    mulai: "2026-11-13T16:02:12+07:00"
    tipe_jalan: null
    ekr: {KR: 1.0, SM: null, KB: null}
    antrean: null
    garis:
      - id: L1
        edge_model: S1->V_Cikapayang
        koordinat: [[600, 456], [980, 420]]
        arah_dihitung: positif

