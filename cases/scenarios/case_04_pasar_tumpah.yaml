      target_edge: [24, 25]
      new_capacity: 900.0
      description: "Pasar tumpah meluap di Jl. Gasibu Atas, kapasitas efektif ruas anjlok dari 1800 menjadi 900 kendaraan/jam (penyempitan 50%) [ASUMSI]."
    - step: 2
      type: "DYNAMIC_EDGE_CAPACITY"
      target_edge: [11, 12]
      new_capacity: 0.0
      description: "Pagi hari pasar: Jl. Singaperbangsa ditutup, kapasitas turun dari 250 menjadi 0 kendaraan/jam sehingga jalur utara menuju PUSDAI terputus (skenario A)."
