<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="origin-when-cross-origin" />
  <title>Visualisasi Graf Aliran Jalan (Maximum Flow) — Gasibu &amp; Monju Bandung</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      --bg-panel: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-panel);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    #sidebar {
      width: 390px;
      min-width: 340px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      overflow-y: auto;
    }

    .header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    .header .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 999px;
      background: #1d4ed8;
      color: #dbeafe;
      margin-bottom: 6px;
    }

    .header h1 {
      font-size: 16px;
      line-height: 1.35;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .controls {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-reset {
      width: 100%;
      padding: 8px 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-reset:hover {
      background: #1d4ed8;
    }

    .opacity-control {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .opacity-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .opacity-header strong {
      color: var(--text-main);
    }

    .opacity-slider {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #334155;
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .opacity-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.4);
    }

    .section-title {
      padding: 12px 18px 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    #path-list {
      padding: 6px 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .path-card {
      background: var(--bg-card);
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .path-card:hover {
      background: var(--bg-card-hover);
    }

    .path-card.active {
      border-color: var(--path-color, #38bdf8);
      background: #1e293b;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    .path-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .path-id-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .path-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    .path-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .path-preview {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.35;
    }

    #path-detail {
      margin: 4px 18px 18px;
      padding: 12px 14px;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
    }

    #path-detail h3 {
      font-size: 13px;
      margin-bottom: 8px;
      color: #f8fafc;
    }

    .street-step-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .street-step {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.35;
    }

    .step-index {
      min-width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #1e293b;
      border: 1px solid #475569;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #e2e8f0;
      flex-shrink: 0;
    }

    .node-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 10px;
    }

    .node-chip {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }

    #map {
      flex: 1;
      height: 100vh;
      background: #e2e8f0;
    }

    /* Animasi garis mengalir searah S -> T */
    @keyframes flowDash {
      from {
        stroke-dashoffset: 36;
      }
      to {
        stroke-dashoffset: 0;
      }
    }

    path.flow-anim-line {
      stroke-dasharray: 10, 8;
      animation: flowDash 0.9s linear infinite;
      pointer-events: none;
    }

    .terminal-label {
      background: #0f172a;
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    .terminal-source {
      background: #15803d;
    }

    .terminal-sink {
      background: #b91c1c;
    }

    .arrow-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      text-shadow: 0 0 3px #000, 0 0 3px #000;
      pointer-events: none;
    }

    /* Patch ruas jalan satuan */
    .segment-patch {
      cursor: pointer;
      transition: stroke 0.15s ease, stroke-width 0.15s ease, opacity 0.15s ease;
    }

    .leaflet-tooltip.segment-tooltip-container {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
    }

    .segment-tooltip {
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #f8fafc;
      padding: 7px 11px;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      font-size: 12px;
      line-height: 1.4;
      pointer-events: none;
    }

    .segment-tooltip .seg-name {
      font-weight: 700;
      color: #38bdf8;
      font-size: 13px;
    }

    .segment-tooltip .seg-detail {
      color: #e2e8f0;
      margin-top: 2px;
    }

    .segment-tooltip .seg-nodes {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column-reverse;
      }
      #sidebar {
        width: 100%;
        height: 46vh;
      }
      #map {
        height: 54vh;
      }
    }
  </style>
</head>

  <aside id="sidebar">
    <div class="header">
      <span class="badge">Kasus 4 • Maximum Flow</span>
      <h1>Jaringan Aliran Jalan Kawasan Gasibu – Monju</h1>

        </div>
        <input
          id="slider-map-opacity"
          class="opacity-slider"
          type="range"
          min="0"
          max="100"
          value="100"
          step="5"
        />
      </div>
    </div>

    <div id="path-list"></div>

    <div id="path-detail"></div>
  </aside>

    window.GRAPH_DATA = GRAPH_DATA;

    const map = L.map('map').setView([-6.8982, 107.6180], 15);

      referrerPolicy: 'origin-when-cross-origin',
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const pathLayers = {};
    const nodeMarkers = {};
    let activePathId = null;

    function computeBearing(lat1, lng1, lat2, lng2) {
      const dy = lat2 - lat1;
      const dx = (lng2 - lng1) * Math.cos((lat1 * Math.PI) / 180);
      return (Math.atan2(dx, dy) * 180) / Math.PI;
    }

    // Render seluruh 4 path beserta animasi mengalir dan penanda arah panah
    GRAPH_DATA.paths.forEach((p) => {
      const baseLine = L.polyline(p.coords, {
        color: p.color,
        weight: 7,
        opacity: 0.75,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);

      const animLine = L.polyline(p.coords, {
        color: '#ffffff',
        weight: 3,
        opacity: 0.95,
        className: 'flow-anim-line'
      }).addTo(map);

      const arrows = [];
      for (let i = 2; i < p.coords.length - 1; i += 4) {
        const [lat1, lng1] = p.coords[i];
        const [lat2, lng2] = p.coords[i + 1];
        const angle = computeBearing(lat1, lng1, lat2, lng2);
        const midLat = (lat1 + lat2) / 2;
        const midLng = (lng1 + lng2) / 2;
        const arrowMarker = L.marker([midLat, midLng], {
          interactive: false,
          icon: L.divIcon({
            className: 'arrow-icon',
            html: `<span style="transform: rotate(${angle}deg); color: ${p.color};">▲</span>`,
            iconSize: [16, 16],
            iconAnchor: [8, 8]
          })
        }).addTo(map);
        arrows.push(arrowMarker);
      }

      baseLine.on('click', () => selectPath(p.id));
      pathLayers[p.id] = { baseLine, animLine, arrows, data: p };
    });

    // Render lapisan patch ruas jalan satuan interaktif dengan tooltip lebar jalan OSM
    const segmentLayers = {};
    GRAPH_DATA.segments.forEach((seg) => {
      const patch = L.polyline(seg.coords, {
        color: '#ffffff',
        weight: 12,
        opacity: 0.15,
        lineCap: 'round',
        lineJoin: 'round',
        className: 'segment-patch'
      }).addTo(map);

      patch.bindTooltip(
        `
        <div class="segment-tooltip">
          <div class="seg-name">${seg.name}</div>
          <div class="seg-detail">📐 Lebar: <strong>${seg.widthInfo}</strong></div>
          <div class="seg-nodes">Ruas: ${seg.fromNode} → ${seg.toNode}</div>
        </div>
        `,
        {
          sticky: true,
          className: 'segment-tooltip-container'
        }
      );

      patch.on('mouseover', () => {
        patch.setStyle({
          color: '#38bdf8',
          weight: 16,
          opacity: 0.9
        });
        patch.bringToFront();
      });

      patch.on('mouseout', () => {
        patch.setStyle({
          color: '#ffffff',
          weight: 12,
          opacity: 0.15
        });
      });

      segmentLayers[seg.id] = patch;
    });

    // Render seluruh simpul (Source S1/S2, Sink T1/T2, dan persimpangan jalan)
    Object.values(GRAPH_DATA.nodes).forEach((node) => {
      const isSource = node.type === 'source';
      const isSink = node.type === 'sink';
      const radius = isSource || isSink ? 9 : 6;
      const fillColor = isSource ? '#22c55e' : isSink ? '#ef4444' : '#f8fafc';
      const borderColor = isSource ? '#14532d' : isSink ? '#7f1d1d' : '#0f172a';

      const marker = L.circleMarker([node.lat, node.lng], {
        radius,
        fillColor,
        color: borderColor,
        weight: 2.5,
        fillOpacity: 1
      }).addTo(map);

      marker.bindTooltip(`<strong>${node.label}</strong>`, {
        direction: 'top',
        offset: [0, -6]
      });

      if (isSource || isSink) {
        L.marker([node.lat, node.lng], {
          interactive: false,
          icon: L.divIcon({
            className: '',
            html: `<div class="terminal-label ${isSource ? 'terminal-source' : 'terminal-sink'}">${node.id}</div>`,
            iconSize: [34, 22],
            iconAnchor: [17, 30]
          })
        }).addTo(map);
      }

      nodeMarkers[node.id] = marker;
    });

    function renderSidebar() {
      const listEl = document.getElementById('path-list');
      const detailEl = document.getElementById('path-detail');

      listEl.innerHTML = GRAPH_DATA.paths
        .map((p) => {
          const isActive = activePathId === p.id;
          return `
            <div class="path-card ${isActive ? 'active' : ''}" data-path-id="${p.id}" style="--path-color: ${p.color}">
              <div class="path-card-header">
                <span class="path-id-pill" style="color: ${p.color}">
                  <span class="color-dot" style="background: ${p.color}"></span>
                  ${p.id}
                </span>
                <span class="path-meta">${p.distanceInfo}</span>
              </div>
              <div class="path-title">${p.name}</div>
              <div class="path-preview">${p.streets.join(' → ')}</div>
            </div>
          `;
        })
        .join('');

      document.querySelectorAll('.path-card').forEach((card) => {
        card.addEventListener('click', () => {
          const id = card.getAttribute('data-path-id');
          selectPath(activePathId === id ? null : id);
        });
      });

      const selected = GRAPH_DATA.paths.find((p) => p.id === activePathId);
      if (!selected) {
        detailEl.innerHTML = `
          <h3>Mode: Semua 4 Jalur Aktif</h3>
          <p style="color: #94a3b8; line-height: 1.4;">
            Keempat jalur ($S_1, S_2 \\to T_1, T_2$) ditampilkan bersamaan. Klik salah satu garis warna di peta atau kartu di atas untuk melihat rincian urutan jalan dan simpul yang dilalui.
          </p>
        `;
      } else {
        const stepsHtml = selected.streets
          .map(
            (s, idx) => `
              <li class="street-step">
                <span class="step-index" style="border-color: ${selected.color}">${idx + 1}</span>
                <span>${s}</span>
              </li>
            `
          )
          .join('');

        const nodesHtml = selected.nodeIds
          .map((nid) => `<span class="node-chip">${GRAPH_DATA.nodes[nid].id}</span>`)
          .join(' → ');

        detailEl.innerHTML = `
          <h3 style="color: ${selected.color}">${selected.name} (${selected.distanceInfo})</h3>
          <div style="font-size: 11px; color: #94a3b8;">Urutan Arah Jalan:</div>
          <ol class="street-step-list">${stepsHtml}</ol>
          <div style="font-size: 11px; color: #94a3b8; margin-top: 10px;">Simpul Graf (${selected.nodeIds.length} Vertex):</div>
          <div class="node-badges">${nodesHtml}</div>
        `;
      }
    }

    function selectPath(pathId) {
      activePathId = pathId;

      GRAPH_DATA.paths.forEach((p) => {
        const layer = pathLayers[p.id];
        const isSelected = !activePathId || activePathId === p.id;
        const isHighlighted = activePathId === p.id;

        layer.baseLine.setStyle({
          weight: isHighlighted ? 10 : isSelected ? 7 : 4,
          opacity: isHighlighted ? 0.95 : isSelected ? 0.75 : 0.18
        });

        layer.animLine.setStyle({
          weight: isHighlighted ? 4 : 3,
          opacity: isSelected ? 0.95 : 0.08
        });

        layer.arrows.forEach((a) => a.setOpacity(isSelected ? 1 : 0.15));

        if (isHighlighted) {
          layer.baseLine.bringToFront();
          layer.animLine.bringToFront();
        }
      });

      const activeNodeSet = new Set(
        activePathId
          ? GRAPH_DATA.paths.find((p) => p.id === activePathId)?.nodeIds || []
          : Object.keys(GRAPH_DATA.nodes)
      );

      Object.entries(nodeMarkers).forEach(([nid, marker]) => {
        const visible = activeNodeSet.has(nid);
        marker.setStyle({
          opacity: visible ? 1 : 0.2,
          fillOpacity: visible ? 1 : 0.2
        });
        if (visible) {
          marker.bringToFront();
        }
      });

      renderSidebar();
    }

    document.getElementById('btn-show-all').addEventListener('click', () => selectPath(null));

    /**
     * Mengatur tingkat transparansi tile layer peta dasar OpenStreetMap.
     * @param {number|string} val - Nilai opacity antara 0 (transparan) hingga 1 (tampak penuh).
     */
    function setMapOpacity(val) {
      const clamped = Math.max(0, Math.min(1, Number(val)));
      tileLayer.setOpacity(clamped);

      const label = document.getElementById('label-map-opacity');
      if (label) {
        label.textContent = `${Math.round(clamped * 100)}%`;
      }

      const slider = document.getElementById('slider-map-opacity');
      if (slider && slider.value !== String(Math.round(clamped * 100))) {
        slider.value = String(Math.round(clamped * 100));
      }
    }

    const sliderMapOpacity = document.getElementById('slider-map-opacity');
    if (sliderMapOpacity) {
      sliderMapOpacity.addEventListener('input', (e) => {
        setMapOpacity(Number(e.target.value) / 100);
      });
    }

    window.setMapOpacity = setMapOpacity;
    window.getMapOpacity = () => tileLayer.options.opacity ?? 1;

    window.selectPath = selectPath;
    window.getActivePathId = () => activePathId;

    renderSidebar();
